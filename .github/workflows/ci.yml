name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  LFC_NODE_VERSION: "24.19.0"
  LFC_NPM_VERSION: "12.0.2"

jobs:
  verify:
    name: Build, test, and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.LFC_NODE_VERSION }}
          package-manager-cache: false

      - name: Set up exact npm
        working-directory: ${{ runner.temp }}
        run: npm install --global "npm@${LFC_NPM_VERSION}" --ignore-scripts

      - name: Install locked development tooling
        run: npm ci --ignore-scripts

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete local quality gate
        run: npm run check

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
          retention-days: 7
