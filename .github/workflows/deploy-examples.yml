name: Deploy static examples

on:
  workflow_run:
    workflows:
      - CI
      - Publish npm alpha
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-examples-deploy-${{ github.repository }}
  queue: max
  cancel-in-progress: false

env:
  LFC_NODE_VERSION: "24.19.0"
  LFC_NPM_VERSION: "12.0.2"

jobs:
  build:
    name: Stage a verified Pages channel
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    outputs:
      channel: ${{ steps.identity.outputs.channel }}
      channel-artifact: ${{ steps.artifact.outputs.name }}
      eligible: ${{ steps.identity.outputs.eligible }}
      source-commit: ${{ steps.identity.outputs.source-commit }}
      version: ${{ steps.identity.outputs.version }}

    steps:
      - name: Check out the exact CI-approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve the deployment identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          LFC_UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          LFC_UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
          LFC_UPSTREAM_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          LFC_WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          source_commit="$(git rev-parse --verify HEAD^{commit})"
          version="$(jq --exit-status --raw-output '.version' package.json)"
          upstream_workflow_path="${LFC_UPSTREAM_WORKFLOW_PATH%@*}"
          git fetch --force --tags origin main
          test "${source_commit}" = "${LFC_WORKFLOW_RUN_SHA}"
          git merge-base --is-ancestor "${source_commit}" origin/main

          eligible=true
          if [[ "${LFC_UPSTREAM_WORKFLOW}" == "CI" &&
            "${upstream_workflow_path}" == ".github/workflows/ci.yml" &&
            "${LFC_UPSTREAM_EVENT}" == "push" ]]; then
            channel="main"
          elif [[ "${LFC_UPSTREAM_WORKFLOW}" == "Publish npm alpha" &&
            "${upstream_workflow_path}" == ".github/workflows/publish-alpha.yml" &&
            "${LFC_UPSTREAM_EVENT}" == "push" ]]; then
            parent_version="$(git show HEAD^1:package.json | jq --exit-status --raw-output '.version')"
            if [[ "${version}" == "${parent_version}" ]]; then
              eligible=false
              channel=""
            else
              channel="release"
            fi
          else
            echo "Unexpected upstream workflow identity: ${LFC_UPSTREAM_WORKFLOW} (${LFC_UPSTREAM_WORKFLOW_PATH})" >&2
            exit 1
          fi

          if [[ "${eligible}" == "true" && "${channel}" == "release" ]]; then
            release_ref="v${version}"
            channel="release"
            if [[ ! "${version}" =~ ^0\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
              echo "A changed release version must be an exact supported alpha." >&2
              exit 1
            fi
            test "$(git rev-parse --verify "${release_ref}^{commit}")" = "${source_commit}"
            release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_ref}")"
            jq --exit-status --arg commit "${source_commit}" --arg tag "${release_ref}" '
              .draft == false and .prerelease == true and .immutable == true and
              .tag_name == $tag and .target_commitish == $commit
            ' <<< "${release}" > /dev/null
          fi

          printf 'eligible=%s\n' "${eligible}" >> "${GITHUB_OUTPUT}"
          printf 'channel=%s\n' "${channel}" >> "${GITHUB_OUTPUT}"
          printf 'source-commit=%s\n' "${source_commit}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up exact Node
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.LFC_NODE_VERSION }}
          package-manager-cache: false

      - name: Set up exact npm
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        working-directory: ${{ runner.temp }}
        run: npm install --global "npm@${LFC_NPM_VERSION}" --ignore-scripts

      - name: Install locked development tooling
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        run: npm ci --ignore-scripts

      - name: Build the verified Pages channel
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        env:
          LFC_EXAMPLES_CHANNEL: ${{ steps.identity.outputs.channel }}
          LFC_EXAMPLES_COMMIT: ${{ steps.identity.outputs.source-commit }}
          LFC_EXAMPLES_VERSION: ${{ steps.identity.outputs.version }}
        run: npm run build

      - name: Stage the self-contained Pages channel
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        env:
          LFC_PAGES_ARTIFACT: ${{ runner.temp }}/pages-channel
        run: node scripts/build-pages.mjs --output "${LFC_PAGES_ARTIFACT}"

      - name: Name the raw verified channel artifact
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        id: artifact
        run: |
          printf 'name=pages-channel-%s-%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload the raw verified channel without deployment authority
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          overwrite: false
          path: ${{ runner.temp }}/pages-channel
          retention-days: 1

  update-snapshot:
    name: Preserve deployment snapshot
    needs: build
    if: ${{ needs.build.result == 'success' && needs.build.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: write

    outputs:
      snapshot-commit: ${{ steps.snapshot.outputs.commit }}

    steps:
      - name: Check out the exact channel tooling without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: pages-site
          persist-credentials: false
          ref: ${{ needs.build.outputs.source-commit }}

      - name: Set up exact Node for canonical Pages assembly
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.LFC_NODE_VERSION }}
          package-manager-cache: false

      - name: Set up exact npm
        working-directory: ${{ runner.temp }}
        run: npm install --global "npm@${LFC_NPM_VERSION}" --ignore-scripts

      - name: Install locked Pages tooling without repository credentials
        working-directory: pages-site
        run: npm ci --ignore-scripts

      - name: Download the raw verified channel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.channel-artifact }}
          path: ${{ runner.temp }}/pages-channel

      - name: Rebase and preserve the built channel with an atomic lease
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          LFC_CHANNEL: ${{ needs.build.outputs.channel }}
          LFC_PAGES_CHANNEL: ${{ runner.temp }}/pages-channel
          LFC_SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
          LFC_VERSION: ${{ needs.build.outputs.version }}
        working-directory: pages-site
        run: |
          set -euo pipefail

          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${LFC_SOURCE_COMMIT}"

          if find "${LFC_PAGES_CHANNEL}" -type l -print -quit | grep -q .; then
            echo "The Pages artifact must not contain symbolic links." >&2
            exit 1
          fi
          expected_channel_entries=(channel.json content shell)
          mapfile -t actual_channel_entries < <(
            find "${LFC_PAGES_CHANNEL}" -mindepth 1 -maxdepth 1 -printf '%f\n' |
              LC_ALL=C sort
          )
          diff -u \
            <(printf '%s\n' "${expected_channel_entries[@]}") \
            <(printf '%s\n' "${actual_channel_entries[@]}")
          cmp --silent \
            "${LFC_PAGES_CHANNEL}/channel.json" \
            "${LFC_PAGES_CHANNEL}/content/examples/metadata.json"
          jq --exit-status \
            --arg channel "${LFC_CHANNEL}" \
            --arg commit "${LFC_SOURCE_COMMIT}" \
            --arg version "${LFC_VERSION}" \
            '. == {channel: $channel, commit: $commit, version: $version}' \
            "${LFC_PAGES_CHANNEL}/channel.json" > /dev/null
          if [[ ! "${LFC_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The Pages channel requires a full lowercase source commit." >&2
            exit 1
          fi
          git cat-file -e "${LFC_SOURCE_COMMIT}^{commit}"
          canonical_origin="https://github.com/${GITHUB_REPOSITORY}.git"
          origin_url="$(git remote get-url origin)"
          test "${origin_url%.git}" = "${canonical_origin%.git}"
          node_path="$(command -v node)"
          assembly_tooling="$(mktemp -d)"
          cp -a -- scripts node_modules "${assembly_tooling}/"
          chmod --recursive go-w,a+rX "${assembly_tooling}"
          sudo --user=nobody test -r \
            "${assembly_tooling}/scripts/assemble-pages.mjs"
          channel_input="$(mktemp -d)"
          cp -a -- "${LFC_PAGES_CHANNEL}" "${channel_input}/channel"
          chmod --recursive go-w,a+rX "${channel_input}"
          state_parent="$(mktemp -d)"
          state_worktree="${state_parent}/state"
          git worktree add --detach "${state_worktree}" "${LFC_SOURCE_COMMIT}"
          snapshot_commit=""
          for attempt in $(seq 1 6); do
            current_pages_commit=absent
            if git -c credential.helper= ls-remote --exit-code --heads \
              "${canonical_origin}" refs/heads/pages-content > /dev/null 2>&1; then
              git -c credential.helper= fetch --force "${canonical_origin}" \
                refs/heads/pages-content:refs/remotes/origin/pages-content
              current_pages_commit="$(git rev-parse --verify refs/remotes/origin/pages-content^{commit})"
            fi

            previous_site="$(mktemp -d)"
            assembly_parent="$(mktemp -d)"
            if [[ "${current_pages_commit}" != "absent" ]]; then
              git archive --format=tar "${current_pages_commit}" |
                tar --extract --file=- --directory="${previous_site}"
            fi
            if find "${previous_site}" -type l -print -quit | grep -q .; then
              echo "The retained Pages snapshot must not contain symbolic links." >&2
              exit 1
            fi
            if [[ "${LFC_CHANNEL}" == "main" &&
              -f "${previous_site}/main/examples/metadata.json" ]]; then
              retained_main_commit="$(
                jq --exit-status --raw-output '
                  if type == "object" and
                    (keys | sort) == ["channel", "commit", "version"] and
                    .channel == "main" and
                    (.commit | type == "string" and test("^[0-9a-f]{40}$"))
                  then .commit
                  else error("Retained main metadata is malformed.")
                  end
                ' "${previous_site}/main/examples/metadata.json"
              )"
              git cat-file -e "${retained_main_commit}^{commit}"
              if ! git merge-base --is-ancestor \
                "${retained_main_commit}" "${LFC_SOURCE_COMMIT}"; then
                echo "The incoming main preview is older than or diverges from the retained preview; use explicit rollback instead." >&2
                exit 1
              fi
            fi

            chmod --recursive go-w,a+rX "${previous_site}"
            sudo chown nobody:nogroup "${assembly_parent}"
            sudo --user=nobody env --ignore-environment \
              HOME="${assembly_parent}" \
              PATH="${PATH}" \
              "${node_path}" "${assembly_tooling}/scripts/assemble-pages.mjs" \
                --previous "${previous_site}" \
                --channel "${channel_input}/channel" \
                --output "${assembly_parent}/snapshot"
            sudo chown --recursive "$(id -u):$(id -g)" "${assembly_parent}"
            chmod --recursive go-w "${assembly_parent}"
            candidate_site="${assembly_parent}/snapshot/site"
            if find "${candidate_site}" -type l -print -quit | grep -q .; then
              echo "Canonical Pages assembly produced a symbolic link." >&2
              exit 1
            fi

            git -C "${state_worktree}" switch --detach "${LFC_SOURCE_COMMIT}"
            git branch --delete --force pages-content 2> /dev/null || true
            if [[ "${current_pages_commit}" == "absent" ]]; then
              git -C "${state_worktree}" switch --orphan pages-content
            else
              git -C "${state_worktree}" switch --force-create pages-content "${current_pages_commit}"
            fi
            git -C "${state_worktree}" rm --force -r --ignore-unmatch .
            cp -a -- "${candidate_site}/." "${state_worktree}"
            test ! -e "${state_worktree}/node_modules"
            diff --brief --recursive --no-dereference --exclude=.git \
              "${candidate_site}" "${state_worktree}"
            rm --force --recursive "${previous_site}" "${assembly_parent}"

            git -C "${state_worktree}" config user.name "github-actions[bot]"
            git -C "${state_worktree}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "${state_worktree}" add --all
            if git -C "${state_worktree}" diff --cached --quiet; then
              observed_pages_commit="$(
                git -c credential.helper= ls-remote --heads \
                  "${canonical_origin}" refs/heads/pages-content |
                  awk 'NR == 1 { print $1 }'
              )"
              [[ -n "${observed_pages_commit}" ]] || observed_pages_commit=absent
              if [[ "${observed_pages_commit}" == "${current_pages_commit}" ]]; then
                snapshot_commit="$(git -C "${state_worktree}" rev-parse --verify HEAD^{commit})"
                break
              fi
              echo "The retained Pages snapshot advanced during no-op attempt ${attempt}; retrying." >&2
              [[ "${attempt}" -lt 6 ]] && sleep 3
              continue
            fi
            git -C "${state_worktree}" commit \
              -m "Deploy ${LFC_CHANNEL} examples from ${LFC_SOURCE_COMMIT}"

            expected_head=""
            if [[ "${current_pages_commit}" != "absent" ]]; then
              expected_head="${current_pages_commit}"
            fi
            gh auth setup-git
            set +e
            git -C "${state_worktree}" -c core.hooksPath=/dev/null push \
              "--force-with-lease=refs/heads/pages-content:${expected_head}" \
              "${canonical_origin}" HEAD:refs/heads/pages-content
            push_status=$?
            set -e
            if [[ "${push_status}" -eq 0 ]]; then
              snapshot_commit="$(git -C "${state_worktree}" rev-parse --verify HEAD^{commit})"
              break
            fi
            echo "The retained Pages snapshot advanced during attempt ${attempt}; rebasing the verified channel." >&2
            [[ "${attempt}" -lt 6 ]] && sleep 3
          done

          if [[ ! "${snapshot_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pages state kept advancing; rerun this workflow after the active deployments finish." >&2
            exit 1
          fi
          git worktree remove --force "${state_worktree}"
          rm --force --recursive \
            "${assembly_tooling}" "${channel_input}" "${state_parent}"
          printf 'commit=%s\n' "${snapshot_commit}" >> "${GITHUB_OUTPUT}"

  package-site:
    name: Package retained Pages snapshot
    needs: update-snapshot
    if: ${{ needs.update-snapshot.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: read

    outputs:
      pages-artifact: ${{ steps.artifact.outputs.name }}
      snapshot-commit: ${{ steps.artifact.outputs.snapshot-commit }}

    env:
      LFC_SNAPSHOT_COMMIT: ${{ needs.update-snapshot.outputs.snapshot-commit }}

    steps:
      - name: Resolve the exact Pages deployment artifact
        id: artifact
        run: |
          set -euo pipefail
          if [[ ! "${LFC_SNAPSHOT_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The packaged Pages snapshot requires a full lowercase commit." >&2
            exit 1
          fi
          printf 'name=github-pages-site-%s-%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          printf 'snapshot-commit=%s\n' "${LFC_SNAPSHOT_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Check out the exact retained snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.LFC_SNAPSHOT_COMMIT }}

      - name: Export the snapshot without repository metadata
        env:
          LFC_PAGES_SITE: ${{ runner.temp }}/pages-site
        run: |
          set -euo pipefail
          mkdir -- "${LFC_PAGES_SITE}"
          git archive --format=tar HEAD | tar --extract --file=- --directory="${LFC_PAGES_SITE}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the retained Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/pages-site
          retention-days: 1

  deploy:
    name: Deploy retained static examples
    needs: package-site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      id-token: write
      pages: write

    steps:
      - name: Confirm the packaged snapshot is still retained
        env:
          GH_TOKEN: ${{ github.token }}
          LFC_SNAPSHOT_COMMIT: ${{ needs.package-site.outputs.snapshot-commit }}
        run: |
          set -euo pipefail
          current_snapshot="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/pages-content" \
              --jq '.object.sha'
          )"
          if [[ "${current_snapshot}" != "${LFC_SNAPSHOT_COMMIT}" ]]; then
            echo "The retained Pages snapshot advanced after packaging; rerun all jobs." >&2
            exit 1
          fi

      - name: Deploy the retained snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: ${{ needs.package-site.outputs.pages-artifact }}
