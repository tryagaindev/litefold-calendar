name: Refresh unchanged screenshot evidence

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: screenshot-evidence-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
  queue: max
  cancel-in-progress: false

env:
  LFC_NODE_VERSION: "24.19.0"

jobs:
  promote:
    name: Promote identical Dependabot screenshot evidence
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: read
      actions: write

    env:
      GITHUB_TOKEN: ${{ github.token }}
      LFC_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      LFC_UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      LFC_UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      LFC_CANDIDATE_DIRECTORY: ${{ runner.temp }}/screenshot-candidate

    steps:
      - name: Check out trusted promotion code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.LFC_NODE_VERSION }}
          package-manager-cache: false

      - name: Validate the originating run and dependency pull request
        id: context
        run: node scripts/screenshot-automation.mjs promotion-context

      - name: Download the validated candidate artifact
        if: ${{ steps.context.outputs.eligible == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          artifact-ids: ${{ steps.context.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/screenshot-candidate

      - name: Refresh identical evidence and verify the new exact head
        if: ${{ steps.context.outputs.eligible == 'true' }}
        run: node scripts/screenshot-automation.mjs promote
