version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    rebase-strategy: auto
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 7 is outside typescript-eslint's supported peer range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Keep Node type definitions aligned with our intended Node 24 LTS line.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
