name: Feature request
description: Propose a focused improvement to the public calendar contract.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the proposed API. Review the [repository requirements](https://github.com/tryagaindev/litefold-calendar/blob/main/CONTRIBUTING.md#repository-requirements) and [change obligations](https://github.com/tryagaindev/litefold-calendar/blob/main/CONTRIBUTING.md#change-obligations), then identify the public contracts the proposal affects.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, what task is difficult, and why current hooks are insufficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and any public API or CSS contract.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include extension or host-side approaches you tried.
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Integration impact
      description: Address each applicable contract and companion-work area from the contributor guide; explain why omitted areas do not apply.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This proposal does not require a runtime, peer, optional, or bundled dependency.
          required: true
        - label: I identified the relevant public contracts and explained compatibility, accessibility, security, dependency, and host-integration effects where applicable.
          required: true
        - label: I searched for existing issues and proposals.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/tryagaindev/litefold-calendar/blob/main/CODE_OF_CONDUCT.md).
          required: true
