name: Usage question
description: Ask for help integrating or using Litefold Calendar.
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Start with the documentation and search existing issues before asking a public usage question. Support is provided on a best-effort basis.

        **Do not disclose security vulnerabilities here.** Use [private vulnerability reporting](https://github.com/tryagaindev/litefold-calendar/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Package version or commit
      description: Give the exact npm version or source commit. If you tested a tarball or generated artifact, include its SHA-256 hash.
      placeholder: Exact npm version; full source commit; artifact SHA-256 when relevant
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Integration goal
      description: Describe what you want your application to do.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: |
        When practical, include a small, dependency-free example, the relevant calendar settings, and sanitized output.
        Sanitized output has private details removed. For example, replace a private event title with a made-up title such as "Sample event".
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        For all reports, include browser and operating-system versions. Name your input device, framework, and relevant assistive technology. Examples include a trackpad and a screen reader.

        For WebMCP reports, also include these sanitized details:
        - The host-agent version, when applicable.
        - The embedding context: where the page runs, such as its own tab or an iframe.
        - The permission policy: the browser-feature rules set by the page or its iframe. Report the relevant setting, or say "none set" if there is none.
        - The feature-detection result: the value of `typeof document.modelContext?.registerTool`.
        - The configured tool prefix and expected tool name.
        - Which stage failed: registration, `get-events`, navigation, or teardown.

        Exclude account, workspace, conversation, tenant, and organization identifiers.
      placeholder: Current Chrome on Windows; plain TypeScript
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched the documentation and existing issues.
          required: true
        - label: I removed credentials, private event data, and other sensitive information.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/tryagaindev/litefold-calendar/blob/main/CODE_OF_CONDUCT.md).
          required: true
