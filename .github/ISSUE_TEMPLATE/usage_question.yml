name: Usage question
description: Ask for help integrating or using litefold-calendar.
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Start with the documentation and search existing issues before asking a public usage question. Support is provided on a best-effort basis.

        **Do not disclose security vulnerabilities here.** Use [private vulnerability reporting](https://github.com/tryagaindev/litefold-calendar/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Package version or commit
      description: Provide the exact npm version or source commit and the SHA-256 when testing a tarball or generated artifact.
      placeholder: Exact npm version; full source commit; artifact SHA-256 when relevant
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Integration goal
      description: Describe the application behavior you are trying to implement.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include a minimal dependency-free example, relevant configuration, and sanitized output when practical.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser and operating-system versions, input device, framework, and relevant assistive technology. For WebMCP, also provide sanitized host version, embedding and permission-policy context, feature-detection result, configured tool prefix, expected tool name, and the failed operation; exclude account, workspace, conversation, tenant, and organization identifiers.
      placeholder: Current Chrome on Windows; plain TypeScript
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched the documentation and existing issues.
          required: true
        - label: I removed credentials, private event data, and other sensitive information.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/tryagaindev/litefold-calendar/blob/main/CODE_OF_CONDUCT.md).
          required: true
