<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-src 'none'; img-src 'self' data:; media-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self'">
	<meta name="color-scheme" content="light dark">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>litefold-calendar basic example</title>
	<link rel="stylesheet" href="../../dist/styles.css">
	<link rel="stylesheet" href="../example.css">
	<link rel="stylesheet" href="../../deployment-details.css">
</head>
<body>
	<main class="example-shell">
		<header class="example-intro">
			<h1>Project calendar</h1>
			<p>The calendar opens on today by default. Open an event directly in the grid or choose a date and use its progressively revealed agenda.</p>
		</header>

		<div class="example-calendar" data-calendar></div>

		<p class="example-result" data-result role="status"></p>
	</main>

	<script type="module" src="./main.js"></script>
	<aside class="lfc-deployment-details" aria-label="Deployment details" data-deployment-channel="release">
		<p><strong>Immutable release</strong></p>
		<dl>
			<dt>Package version</dt>
			<dd><code>0.2.0-alpha.0</code></dd>
			<dt>Source commit</dt>
			<dd><code>8250ac4da9ada72a2915b8f810be404667ab47da</code></dd>
			<dt>Deployment channel</dt>
			<dd>Immutable release</dd>
		</dl>
	</aside>
</body>
</html>
