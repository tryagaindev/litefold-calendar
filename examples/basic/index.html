<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="color-scheme" content="light dark">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Basic JavaScript | litefold-calendar</title>
	<link rel="stylesheet" href="../../dist/styles.css">
	<link rel="stylesheet" href="../example.css">
</head>
<body>
	<main class="my-shell">
		<header class="my-intro">
			<h1>Render static events with JavaScript</h1>
			<p>Select today, then activate an event from the month grid or agenda. The status below identifies the event and the surface that opened it.</p>
		</header>

		<div class="my-calendar" data-my-calendar></div>

		<p class="my-result" data-my-result role="status" aria-atomic="true"></p>
	</main>

	<script type="module" src="./main.js"></script>
</body>
</html>
