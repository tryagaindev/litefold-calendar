<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="color-scheme" content="light dark">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Classic-script loader | litefold-calendar</title>
	<link rel="stylesheet" href="../../dist/styles.css">
	<link rel="stylesheet" href="../example.css">
	<script defer src="./main.js"></script>
</head>
<body>
	<main class="example-shell">
		<header class="example-intro">
			<h1>Load ESM from a classic script</h1>
			<p>Select August 4, 2026 and activate an event. This page uses a deferred classic entry script, which loads the ESM package with dynamic <code>import()</code>.</p>
		</header>

		<p class="example-alert" data-startup-error role="alert" aria-atomic="true"></p>
		<div class="example-calendar" data-calendar></div>
		<p class="example-result" data-result role="status" aria-atomic="true"></p>
	</main>
</body>
</html>
