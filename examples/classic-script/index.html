<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="color-scheme" content="light dark">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>litefold-calendar classic-script example</title>
	<link rel="stylesheet" href="../../dist/styles.css">
	<link rel="stylesheet" href="../example.css">
	<script defer src="./main.js"></script>
</head>
<body>
	<main class="example-shell">
		<header class="example-intro">
			<h1>Load ESM from a classic script</h1>
			<p>Select a date and activate an event, then inspect <code>main.js</code> to see a classic entry point load the package with dynamic <code>import()</code>.</p>
		</header>

		<p class="example-alert" data-startup-error role="alert"></p>
		<div class="example-calendar" data-calendar></div>
		<p class="example-result" data-result role="status"></p>
	</main>
</body>
</html>
