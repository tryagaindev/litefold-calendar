<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="color-scheme" content="light dark">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>litefold-calendar classic-script example</title>
	<link rel="stylesheet" href="../../dist/styles.css">
	<link rel="stylesheet" href="../example.css">
	<script defer src="./main.js"></script>
</head>
<body>
	<main class="example-shell">
		<header class="example-intro">
			<h1>Classic-script calendar</h1>
			<p>The page entry uses a regular script while loading litefold-calendar from its local ESM build. Event actions remain native links or buttons.</p>
		</header>

		<p class="example-alert" data-startup-error role="alert"></p>
		<div class="example-calendar" data-calendar></div>
		<p class="example-result" data-result role="status"></p>
	</main>
</body>
</html>
