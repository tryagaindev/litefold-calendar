<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="color-scheme" content="light dark">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Async errors | litefold-calendar</title>
	<link rel="stylesheet" href="../../dist/styles.css">
	<link rel="stylesheet" href="../example.css">
</head>
<body>
	<main class="example-shell">
		<header class="example-intro">
			<h1>Handle asynchronous failures</h1>
			<p>Trigger source, action, and render-hook failures. Compare the package's default presentation with an application-owned source error.</p>
		</header>

		<section class="example-panel" data-controls aria-labelledby="failure-controls-title">
			<h2 id="failure-controls-title">Failure controls</h2>
			<p>Source failures retain the last successful events. Changing render-hook mode creates a new calendar instance.</p>
			<div class="example-control-row">
				<label class="example-check">
					<input type="checkbox" data-host-ownership>
					Use application source-error UI
				</label>
				<label class="example-check">
					<input type="checkbox" data-fail-render-hooks>
					Make render hooks fail
				</label>
				<label class="example-check">
					<input type="checkbox" data-fail-action>
					Make event actions reject
				</label>
				<button class="example-button" type="button" data-fail-next>Fail next source request</button>
				<button class="example-button" type="button" data-refetch>Refetch events</button>
			</div>
		</section>

		<section class="example-alert" data-host-error aria-labelledby="example-host-error-title" hidden>
			<h2 id="example-host-error-title" data-host-error-title></h2>
			<span data-host-error-message></span>
			<button class="example-button" type="button" data-host-retry>Try again</button>
		</section>

		<div class="example-calendar" data-calendar></div>

		<div class="example-visually-hidden" data-announcer-polite role="status" aria-atomic="true"></div>
		<div class="example-visually-hidden" data-announcer-assertive role="alert" aria-atomic="true"></div>
	</main>

	<script type="module" src="./main.js"></script>
</body>
</html>
